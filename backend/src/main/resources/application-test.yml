# Testes de integração: banco e Mailpit vêm do Testcontainers (T-003), via
# IntegrationTest#containerProperties (@DynamicPropertySource); nada aponta para a máquina do
# desenvolvedor.
spring:
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  jobs:
    enabled: false   # T-019 (D-09): o @Scheduled não dispara nos testes; eles chamam JobRunner.runAll() direto

logging:
  level:
    br.com.cuidamais: DEBUG
    org.testcontainers: INFO
