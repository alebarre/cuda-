# Produção: Gmail SMTP com senha de app (plan D-24). Usuário e senha SÓ por variável de
# ambiente (MAIL_USERNAME, MAIL_PASSWORD); nunca no repositório.
spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  level:
    br.com.cuidamais: INFO
